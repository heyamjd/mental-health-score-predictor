services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────
  - type: web
    name: mhsp-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ALLOWED_ORIGINS
        # Set this to your static site URL after deployment, e.g.:
        # value: https://mhsp-frontend.onrender.com
        value: "*"
      - key: RATE_LIMIT
        value: "30/minute"
    # Render free tier auto-sleeps after 15 min inactivity → cold starts ~30s
    autoDeploy: true
    disk:
      name: models-disk
      mountPath: /models
      sizeGB: 1

  # ── Static Site (Frontend) ───────────────────────────────────────────────
  - type: web
    name: mhsp-frontend
    runtime: static
    staticPublishPath: frontend
    headers:
      - path: "/*"
        name: X-Frame-Options
        value: DENY
      - path: "/*"
        name: X-Content-Type-Options
        value: nosniff
      - path: "/*"
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html
